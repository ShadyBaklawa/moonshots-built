name: Upgrade a prototype

on:
  schedule:
    - cron: "23 6 * * 3"   # Wednesdays 06:23 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: "Prototype folder to upgrade (blank = pick automatically)"
        required: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # Exact Node with the Brotli decoder fix (CVE-2026-111497): npm runs on it and the
      # builder agent may run `node`. Claude Code itself is a native binary.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Install tools
        run: |
          pip install --require-hashes -r requirements.lock
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code --before="$(date -u -d '7 days ago' +%F)"   # 7-day cooldown (CLAUDE.md "Dependencies")

      - name: Review and upgrade
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODEL: ${{ vars.MODEL }}
          PASS_SCORE: ${{ vars.PASS_SCORE }}
          SLUG: ${{ inputs.slug }}
        run: |
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -n "$SLUG" ]; then python -m pipeline upgrade "$SLUG"; else python -m pipeline upgrade; fi

      - name: Save state and open pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
        run: bash scripts/ship.sh out/upgrade.json
