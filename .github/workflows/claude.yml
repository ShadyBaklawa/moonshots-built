# Optional: comment "@claude <request>" on a prototype PR (e.g. a draft that failed review)
# and Claude pushes fixes to that branch. Needs the Claude GitHub App installed on the repo
# (https://github.com/apps/claude) and the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude on PRs

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only the owner and collaborators can trigger it; on a public repo anyone can comment.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    # Pinned: Playwright 1.56 can't install Chromium on Ubuntu 26.04, which ubuntu-latest
    # became on 2026-11-19. Go back to ubuntu-latest after a Playwright bump that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test tooling
        run: |
          pip install --require-hashes -r requirements.lock
          python -m playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --append-system-prompt-file prompts/standards.md
            --settings .claude/hooks/loop_breaker.settings.json
            --allowedTools "Bash(python3 scripts/smoke.py *),Bash(python scripts/smoke.py *),Bash(ls *)"
