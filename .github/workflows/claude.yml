# Optional: comment "@claude <request>" on a prototype PR (e.g. a draft that failed review)
# and Claude pushes fixes to that branch. Needs the Claude GitHub App installed on the repo
# (https://github.com/apps/claude) and the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude on PRs

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test tooling
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --append-system-prompt-file prompts/standards.md
            --allowedTools "Bash(python3 scripts/smoke.py *),Bash(python scripts/smoke.py *),Bash(ls *)"
